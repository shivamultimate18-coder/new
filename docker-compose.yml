# App, worker and Caddy (HTTPS). The database either runs here too (pilot: add
# `--profile with-db`) or on a separate server on the private network (plan section 5).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Background jobs: lead imports, AI drafting, reply labels and the sending engine.
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["npx", "tsx", "--conditions=react-server", "scripts/worker.ts"]

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

  # Single-server pilot only: `docker compose --profile with-db up -d`.
  # Then DATABASE_URL=postgres://outreach:<POSTGRES_PASSWORD>@db:5432/outreach
  db:
    image: postgres:16
    profiles: ["with-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: outreach
      # The postgres image refuses to start without a password, which makes a missing one obvious.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: outreach
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "outreach"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  pg_data:
